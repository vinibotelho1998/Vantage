name: Linux
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar bibliotecas do Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -e '.[dev]'
      - name: Testar núcleo e interface nativa
        run: |
          python -m pytest -q tests/test_frames.py tests/test_series.py tests/test_session_recorder.py tests/test_units.py tests/test_config.py tests/test_linux_port.py
          python scripts/smoke_linux.py
      - name: Empacotar fontes e lançador Linux
        run: |
          version=$(python -c 'from vantage import __version__; print(__version__)')
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          chmod +x Vantage.sh
          git ls-files -z | tar --null -T - --transform='s,^,Vantage/,' -czf Vantage-linux.tar.gz
          sha256sum Vantage-linux.tar.gz > Vantage-linux.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Vantage-linux
          path: |
            Vantage-linux.tar.gz
            Vantage-linux.sha256
          if-no-files-found: error

  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Vantage-linux
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Vantage-linux.tar.gz
            Vantage-linux.sha256
          fail_on_unmatched_files: true
          make_latest: false
