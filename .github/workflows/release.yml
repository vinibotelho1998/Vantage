name: Build e Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build do app (PyInstaller)
        run: pyinstaller packaging/DBXStats.spec --noconfirm --distpath dist --workpath build

      - name: Baixar dependencias de runtime (.NET 6/8, VC++)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/prepare_prereqs.ps1

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compilar instalador
        id: versao
        run: |
          $versao = (Select-String -Path src/dbxstats/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$versao" packaging\DBXStats_Setup.iss
          echo "numero=$versao" >> $env:GITHUB_OUTPUT

      - name: Publicar release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes 2>$null
          gh release create latest "dist/DBXStats-Setup.exe" `
            --title "DBX Stats v${{ steps.versao.outputs.numero }}" `
            --notes "Instalador gerado automaticamente do commit ${{ github.sha }} (versao ${{ steps.versao.outputs.numero }}). Inclui app, LibreHardwareMonitor, PresentMon e dependencias (.NET 6/8, VC++)." `
            --latest
