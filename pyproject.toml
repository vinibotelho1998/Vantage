[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vantage"
version = "3.4.5"
description = "Vantage: monitor de hardware e desempenho em jogos para Windows"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.11.1",
    "pythonnet>=3.1.0",
    "psutil>=7.0",
    "pywin32>=311",
    "wmi>=1.5.1",
    "nvidia-ml-py>=12.0",
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.18"]

[project.gui-scripts]
vantage = "vantage.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]
